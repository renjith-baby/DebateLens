[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debatelens"
version = "0.1.0"
description = "DebateLens: audio/YouTube debate -> transcript -> analysis -> dashboard"
requires-python = ">=3.11"
dependencies = [
    # analysis pipeline
    "pydantic>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    # transcribe-service
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.4.9",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
]

[project.scripts]
debatelens = "debatelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
