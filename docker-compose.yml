services:
  transcribe-service:
    build:
      context: ../..
      dockerfile: DebateLens/transcribe-service/Dockerfile
    image: transcribe-service:local
    ports:
      - "8080:8080"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
